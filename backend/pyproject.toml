[project]
name = "whos-knocking"
version = "2.0.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "S104", "S608"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S107"]
"scripts/*" = ["S311"]  # fake demo data, not security-relevant
