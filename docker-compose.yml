# Local run: SECRET_KEY=$(python -c "import secrets;print(secrets.token_hex(32))") docker compose up --build
services:
  web:
    build: .
    container_name: devops-monitor
    ports:
      - "5000:5000"
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
      ALLOW_SIGNUP: "true"
      SESSION_COOKIE_SECURE: "false"
    volumes:
      - monitor-data:/app/data
    restart: unless-stopped

volumes:
  monitor-data:
