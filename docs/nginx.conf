upstream whos_knocking {
    server 127.0.0.1:5000;  # container started by the CI/CD pipeline, bound to localhost only
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name trevorvaughan.dev www.trevorvaughan.dev;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name trevorvaughan.dev www.trevorvaughan.dev;

    ssl_certificate /etc/letsencrypt/live/trevorvaughan.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trevorvaughan.dev/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' wss://$host; frame-ancestors 'none'; base-uri 'self'" always;

    access_log /var/log/nginx/whos_knocking_access.log;
    error_log /var/log/nginx/whos_knocking_error.log;

    client_max_body_size 1M;

    # Live feed: a long-lived WebSocket (the app pings every 25 s)
    location /api/live {
        proxy_pass http://whos_knocking;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://whos_knocking;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
