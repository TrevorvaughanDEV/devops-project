name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Never run two deploys at once; a newer push waits for the current one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: trevorvaughandev/devops-app

jobs:
  backend:
    name: Backend lint, tests and audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Tests (pytest, including a real SSH login against the honeypot)
        run: pytest -v

      - name: Dependency vulnerability scan (pip-audit)
        run: pip-audit -r requirements.txt

  frontend:
    name: Frontend typecheck, build and audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - name: Typecheck and build
        run: npm run build
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

  terraform:
    name: Terraform format and validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -diff -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  build:
    name: Build and smoke-test image
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .

      - name: Smoke test the container
        run: |
          docker run -d --name smoke -p 5000:5000 -p 2222:2222 "$IMAGE:${{ github.sha }}"
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:5000/healthz && break
            sleep 2
          done
          set -e
          curl -fsS http://127.0.0.1:5000/api/summary
          curl -fsS http://127.0.0.1:5000/ | grep -q "Who's Knocking"
          # The honeypot must answer with an OpenSSH-looking banner
          timeout 5 bash -c 'exec 3<>/dev/tcp/127.0.0.1/2222; head -n 1 <&3' | tee /dev/stderr | grep -q "SSH-2.0-OpenSSH"
          echo; echo "Healthy"
      - name: Show logs on failure
        if: failure()
        run: docker logs smoke

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push image
        if: github.event_name == 'push'
        run: |
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

  deploy:
    name: Deploy to cloud VM
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
    steps:
      # With no server configured (e.g. between hosts), skip the rollout instead of
      # failing, so test and build results still show on the badge.
      - name: Check a deploy target is configured
        id: target
        run: |
          if [ -n "$DEPLOY_HOST" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DEPLOY_HOST secret not set; image built and pushed, rollout skipped."
          fi

      - name: Roll out new container with health check and rollback
        if: steps.target.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.0.0
        env:
          NEW_IMAGE: ${{ env.IMAGE }}:${{ github.sha }}
          ABUSEIPDB_KEY: ${{ secrets.ABUSEIPDB_KEY }}
          HONEYPOT_PORT: ${{ vars.HONEYPOT_PORT || '2222' }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ vars.ADMIN_SSH_PORT || '22' }}
          username: ${{ secrets.DEPLOY_USER || 'ubuntu' }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: NEW_IMAGE,ABUSEIPDB_KEY,HONEYPOT_PORT
          script: |
            set -euo pipefail
            NAME=devops-monitor
            VOLUME=devops-monitor-data

            run_container() {
              sudo docker run -d --name "$NAME" --restart unless-stopped \
                -p 127.0.0.1:5000:5000 \
                -p "$HONEYPOT_PORT":2222 \
                -e PUBLIC_SENSOR_PORT="$HONEYPOT_PORT" \
                -e ABUSEIPDB_KEY="${ABUSEIPDB_KEY:-}" \
                --memory 400m \
                -v "$VOLUME":/app/data \
                "$1"
            }

            healthy() {
              for i in $(seq 1 20); do
                curl -fsS http://127.0.0.1:5000/healthz >/dev/null && return 0
                sleep 3
              done
              return 1
            }

            sudo docker pull "$NEW_IMAGE"

            OLD=$(sudo docker ps -aq --filter "name=^${NAME}$")
            PREV_IMAGE=""
            [ -n "$OLD" ] && PREV_IMAGE=$(sudo docker inspect --format '{{.Config.Image}}' "$OLD")

            # The app runs as uid 1000 and writes its database and SSH host keys here.
            sudo docker run --rm -v "$VOLUME":/data alpine chown -R 1000:1000 /data

            sudo docker rm -f "$NAME" 2>/dev/null || true
            run_container "$NEW_IMAGE"

            if healthy; then
              echo "Deployed $NEW_IMAGE"
              sudo docker image prune -f
            else
              echo "Health check failed for $NEW_IMAGE"
              sudo docker logs --tail 50 "$NAME" || true
              sudo docker rm -f "$NAME"
              if [ -n "$PREV_IMAGE" ]; then
                echo "Rolling back to $PREV_IMAGE"
                run_container "$PREV_IMAGE"
              fi
              exit 1
            fi
