name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Never run two deploys at once; a newer push waits for the current one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: trevorvaughandev/devops-app

jobs:
  test:
    name: Lint, test and audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Unit tests (pytest)
        run: pytest -v

      - name: Dependency vulnerability scan (pip-audit)
        run: pip-audit -r requirements.txt

  build:
    name: Build and smoke-test image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .

      - name: Smoke test the container
        run: |
          docker run -d --name smoke -p 5000:5000 \
            -e SECRET_KEY=ci-only-secret -e SESSION_COOKIE_SECURE=false \
            "$IMAGE:${{ github.sha }}"
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:5000/healthz; then echo; echo "Healthy"; exit 0; fi
            sleep 2
          done
          docker logs smoke
          exit 1

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push image
        if: github.event_name == 'push'
        run: |
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

  deploy:
    name: Deploy to AWS EC2
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Roll out new container with health check and rollback
        uses: appleboy/ssh-action@v1.0.0
        env:
          APP_SECRET_KEY: ${{ secrets.APP_SECRET_KEY }}
          NEW_IMAGE: ${{ env.IMAGE }}:${{ github.sha }}
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ubuntu
          key: ${{ secrets.AWS_SSH_KEY }}
          envs: APP_SECRET_KEY,NEW_IMAGE
          script: |
            set -euo pipefail
            NAME=devops-monitor

            if [ -z "${APP_SECRET_KEY:-}" ]; then
              echo "APP_SECRET_KEY secret is not set in GitHub; refusing to deploy"; exit 1
            fi

            run_container() {
              sudo docker run -d --name "$NAME" -p 5000:5000 --restart unless-stopped \
                -e SECRET_KEY="$APP_SECRET_KEY" \
                -e ALLOW_SIGNUP=false \
                -v devops-monitor-data:/app/data \
                "$1"
            }

            healthy() {
              for i in $(seq 1 20); do
                curl -fsS http://127.0.0.1:5000/healthz >/dev/null && return 0
                sleep 3
              done
              return 1
            }

            sudo docker pull "$NEW_IMAGE"
            PREV_IMAGE=$(sudo docker inspect --format '{{.Config.Image}}' "$NAME" 2>/dev/null || true)

            # Remove only this app's container (and any old unnamed one holding port 5000)
            sudo docker rm -f "$NAME" 2>/dev/null || true
            sudo docker ps -q --filter "publish=5000" | xargs -r sudo docker rm -f

            run_container "$NEW_IMAGE"

            if healthy; then
              echo "Deployed $NEW_IMAGE"
              sudo docker image prune -f
            else
              echo "Health check failed for $NEW_IMAGE"
              sudo docker logs --tail 50 "$NAME" || true
              sudo docker rm -f "$NAME"
              if [ -n "$PREV_IMAGE" ]; then
                echo "Rolling back to $PREV_IMAGE"
                run_container "$PREV_IMAGE"
              fi
              exit 1
            fi
