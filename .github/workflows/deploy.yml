name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Never run two deploys at once; a newer push waits for the current one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: trevorvaughandev/devops-app

jobs:
  test:
    name: Lint, test and audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Unit tests (pytest)
        run: pytest -v

      - name: Dependency vulnerability scan (pip-audit)
        run: pip-audit -r requirements.txt

  build:
    name: Build and smoke-test image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .

      - name: Smoke test the container
        run: |
          docker run -d --name smoke -p 5000:5000 \
            -e SECRET_KEY=ci-only-secret -e SESSION_COOKIE_SECURE=false \
            "$IMAGE:${{ github.sha }}"
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:5000/healthz; then echo; echo "Healthy"; exit 0; fi
            sleep 2
          done
          docker logs smoke
          exit 1

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push image
        if: github.event_name == 'push'
        run: |
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

  deploy:
    name: Deploy to cloud VM
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
    steps:
      # With no server configured (e.g. between hosts), skip the rollout instead of
      # failing, so test and build results still show on the badge.
      - name: Check a deploy target is configured
        id: target
        run: |
          if [ -n "$DEPLOY_HOST" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DEPLOY_HOST secret not set; image built and pushed, rollout skipped."
          fi

      - name: Roll out new container with health check and rollback
        if: steps.target.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.0.0
        env:
          APP_SECRET_KEY: ${{ secrets.APP_SECRET_KEY }}
          NEW_IMAGE: ${{ env.IMAGE }}:${{ github.sha }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER || 'ubuntu' }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: APP_SECRET_KEY,NEW_IMAGE
          script: |
            set -euo pipefail
            NAME=devops-monitor
            VOLUME=devops-monitor-data

            # Session key: use the GitHub secret if one is set; otherwise generate one
            # on the server the first time and keep it there (readable only by ubuntu).
            SECRET_FILE="$HOME/.devops-monitor-secret"
            if [ -n "${APP_SECRET_KEY:-}" ]; then
              KEY="$APP_SECRET_KEY"
            else
              if [ ! -s "$SECRET_FILE" ]; then
                (umask 077; openssl rand -hex 32 > "$SECRET_FILE")
                echo "Generated a new session key in $SECRET_FILE"
              fi
              KEY=$(cat "$SECRET_FILE")
            fi

            run_container() {
              sudo docker run -d --name "$NAME" -p 5000:5000 --restart unless-stopped \
                -e SECRET_KEY="$KEY" \
                -e ALLOW_SIGNUP=false \
                -v "$VOLUME":/app/data \
                "$1"
            }

            healthy() {
              for i in $(seq 1 20); do
                curl -fsS http://127.0.0.1:5000/healthz >/dev/null && return 0
                sleep 3
              done
              return 1
            }

            sudo docker pull "$NEW_IMAGE"

            # The container currently serving the site: the named one, or an older
            # unnamed one from before this pipeline existed.
            OLD=$(sudo docker ps -aq --filter "name=^${NAME}$")
            [ -z "$OLD" ] && OLD=$(sudo docker ps -q --filter "publish=5000" | head -n1)
            PREV_IMAGE=""
            [ -n "$OLD" ] && PREV_IMAGE=$(sudo docker inspect --format '{{.Config.Image}}' "$OLD")

            # One-time migration: older versions kept the database inside the container
            # at /app/metrics.db. Copy it into the volume so existing accounts survive.
            if ! sudo docker run --rm -v "$VOLUME":/data alpine test -s /data/metrics.db; then
              TMP=$(mktemp -d)
              if [ -n "$OLD" ] && sudo docker cp "$OLD":/app/metrics.db "$TMP/metrics.db" 2>/dev/null; then
                sudo docker run --rm -v "$VOLUME":/data -v "$TMP":/src alpine \
                  sh -c 'cp /src/metrics.db /data/metrics.db && chown -R 1000:1000 /data'
                echo "Migrated existing database into volume $VOLUME"
              else
                sudo docker run --rm -v "$VOLUME":/data alpine chown -R 1000:1000 /data
              fi
              sudo rm -rf "$TMP"
            fi

            [ -n "$OLD" ] && sudo docker rm -f "$OLD"
            sudo docker rm -f "$NAME" 2>/dev/null || true

            run_container "$NEW_IMAGE"

            if healthy; then
              echo "Deployed $NEW_IMAGE"
              sudo docker image prune -f
            else
              echo "Health check failed for $NEW_IMAGE"
              sudo docker logs --tail 50 "$NAME" || true
              sudo docker rm -f "$NAME"
              if [ -n "$PREV_IMAGE" ]; then
                echo "Rolling back to $PREV_IMAGE"
                run_container "$PREV_IMAGE"
              fi
              exit 1
            fi
