name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# CI only. Deployment is pull-based: the server checks main every two minutes and
# deploys new commits itself (scripts/autodeploy.sh), running the same tests first.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: trevorvaughandev/devops-app

jobs:
  backend:
    name: Backend lint, tests and audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Tests (pytest, including a real SSH login against the honeypot)
        run: pytest -v

      - name: Dependency vulnerability scan (pip-audit)
        run: pip-audit -r requirements.txt

  frontend:
    name: Frontend typecheck, build and audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - name: Typecheck and build
        run: npm run build
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

  terraform:
    name: Terraform format and validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -diff -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  build:
    name: Build and smoke-test image
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .

      - name: Smoke test the container
        run: |
          docker run -d --name smoke -p 5000:5000 -p 2222:2222 "$IMAGE:${{ github.sha }}"
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:5000/healthz && break
            sleep 2
          done
          set -e
          curl -fsS http://127.0.0.1:5000/api/summary
          curl -fsS http://127.0.0.1:5000/ | grep -q "Who's Knocking"
          # The honeypot must answer with an OpenSSH-looking banner
          timeout 5 bash -c 'exec 3<>/dev/tcp/127.0.0.1/2222; head -n 1 <&3' | tee /dev/stderr | grep -q "SSH-2.0-OpenSSH"
          echo; echo "Healthy"
      - name: Show logs on failure
        if: failure()
        run: docker logs smoke

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push image
        if: github.event_name == 'push'
        run: |
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

  kubernetes:
    name: Deploy to a Kubernetes cluster (kind)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t "$IMAGE:latest" .

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: whos-knocking

      - name: Load image into the cluster
        run: kind load docker-image "$IMAGE:latest" --name whos-knocking

      - name: Apply manifests and wait for the rollout
        run: |
          kubectl apply -k k8s/
          kubectl -n whos-knocking rollout status deployment/whos-knocking --timeout=180s

      - name: Smoke test inside the cluster
        run: |
          kubectl -n whos-knocking port-forward svc/whos-knocking-web 8080:80 &
          kubectl -n whos-knocking port-forward svc/whos-knocking-honeypot 2222:22 &
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8080/healthz && break
            sleep 2
          done
          set -e
          curl -fsS http://127.0.0.1:8080/api/summary
          curl -fsS http://127.0.0.1:8080/ | grep -q "Who's Knocking"
          timeout 5 bash -c 'exec 3<>/dev/tcp/127.0.0.1/2222; head -n 1 <&3' | tee /dev/stderr | grep -q "SSH-2.0-OpenSSH"
          echo; echo "Healthy on Kubernetes"

      - name: Show cluster state on failure
        if: failure()
        run: |
          kubectl -n whos-knocking get all,pvc
          kubectl -n whos-knocking describe pods
          kubectl -n whos-knocking logs deployment/whos-knocking --tail=100
